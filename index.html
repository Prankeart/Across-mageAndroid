<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a0a">
<title>Renk Kanalı</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#0a0a0a;color:#f0f0f0;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;min-height:100dvh;overscroll-behavior:none}
  body{display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
  header{padding:14px 16px;font-size:16px;font-weight:600;text-align:center;
    border-bottom:1px solid #1a1a1c;flex-shrink:0;letter-spacing:.3px}
  .tabs{display:flex;padding:12px 12px 0;gap:8px;flex-shrink:0}
  .tabs button{flex:1;padding:14px;font-size:15px;font-weight:600;
    background:#1a1a1c;color:#888;border:0;border-radius:12px;cursor:pointer;
    font-family:inherit;transition:background .15s,color .15s}
  .tabs button.on{background:#4f8cff;color:#fff}
  main{flex:1;padding:12px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .hidden{display:none!important}
  .btn{display:block;width:100%;padding:16px;font-size:16px;font-weight:600;
    background:#4f8cff;color:#fff;border:0;border-radius:14px;cursor:pointer;
    margin-top:10px;font-family:inherit;-webkit-appearance:none;appearance:none;
    transition:transform .08s}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:#1a1a1c;color:#f0f0f0}
  .btn:disabled{opacity:.4;pointer-events:none}
  .btn.big{padding:22px;font-size:18px;border-radius:16px}
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px 20px;gap:8px;min-height:55vh}
  .empty .icon{font-size:60px;margin-bottom:6px;line-height:1;opacity:.95}
  .empty .title{font-size:21px;font-weight:700}
  .empty .desc{font-size:14px;color:#888;line-height:1.5;max-width:320px;margin-bottom:8px}
  .card{background:#1a1a1c;border-radius:16px;padding:12px;margin-bottom:12px}
  .preview{width:100%;max-height:50vh;border-radius:12px;display:block;
    background:#000;object-fit:contain;margin:0 auto}
  .info{font-size:13px;color:#aaa;margin:10px 0;text-align:center;line-height:1.5}
  .video-wrap{position:relative;border-radius:16px;overflow:hidden;background:#000;
    aspect-ratio:4/3;margin-bottom:12px}
  .video-wrap video{width:100%;height:100%;object-fit:cover;display:block}
  .target{position:absolute;top:18%;left:18%;right:18%;bottom:18%;
    border:2px solid rgba(79,140,255,.95);border-radius:14px;pointer-events:none;
    box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
  .target::after{content:'';position:absolute;top:50%;left:50%;
    width:6px;height:6px;background:rgba(79,140,255,.7);
    border-radius:50%;transform:translate(-50%,-50%)}
  .status-bar{display:flex;align-items:center;gap:10px;padding:12px 14px;
    background:#1a1a1c;border-radius:12px;margin-bottom:10px}
  .status-dot{width:10px;height:10px;border-radius:50%;background:#666;
    flex-shrink:0;transition:background .2s}
  .status-dot.live{background:#22c55e;animation:pulse 1.4s infinite}
  .status-dot.warn{background:#f59e0b}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .status-text{font-size:14px;flex:1;line-height:1.3}
  .progress{height:6px;background:#1a1a1c;border-radius:3px;overflow:hidden;
    margin-bottom:8px}
  .progress > div{height:100%;background:#4f8cff;width:0;
    transition:width .3s ease;border-radius:3px}
  .stats{font-size:12px;color:#777;text-align:center;margin-bottom:12px}
  .result-img{width:100%;border-radius:12px;display:block;background:#000;
    image-rendering:pixelated;image-rendering:crisp-edges}
  .overlay{position:fixed;inset:0;z-index:9999;display:none;
    align-items:center;justify-content:center;
    font-size:22vmin;font-weight:800;color:rgba(255,255,255,.9);
    text-shadow:0 4px 20px rgba(0,0,0,.35);cursor:pointer;
    transition:background-color .04s linear}
  .overlay.show{display:flex}
</style>
</head>
<body>

<header>📻 Renk Kanalı</header>
<div class="tabs">
  <button id="tabS" class="on">📤 Gönder</button>
  <button id="tabR">📥 Al</button>
</div>

<main>
  <!-- ============ GÖNDER ============ -->
  <section id="send">
    <div id="sendEmpty" class="empty">
      <div class="icon">🖼️</div>
      <div class="title">Fotoğraf Gönder</div>
      <div class="desc">Bir fotoğraf seçin. Diğer telefon kamerayı bu ekrana tutarak fotoğrafı alacak.</div>
      <button class="btn big" id="pickBtn">📷 Fotoğraf Seç</button>
    </div>
    <div id="sendReady" class="hidden">
      <div class="card">
        <img id="preview" class="preview" alt="">
      </div>
      <div class="info" id="sendInfo"></div>
      <button class="btn big" id="startBtn">▶ Göndermeyi Başlat</button>
      <button class="btn ghost" id="changeBtn">Değiştir</button>
    </div>
  </section>

  <!-- ============ AL ============ -->
  <section id="recv" class="hidden">
    <div id="recvEmpty" class="empty">
      <div class="icon">📡</div>
      <div class="title">Fotoğraf Al</div>
      <div class="desc">Kamerayı gönderen telefonun ekranına tutun. Ayar yapmanıza gerek yok.</div>
      <button class="btn big" id="listenBtn">📷 Kamerayı Başlat</button>
    </div>
    <div id="recvActive" class="hidden">
      <div class="video-wrap">
        <video id="video" playsinline muted autoplay></video>
        <div class="target"></div>
      </div>
      <div class="status-bar">
        <div class="status-dot" id="statusDot"></div>
        <div class="status-text" id="statusText">Hazırlanıyor…</div>
      </div>
      <div class="progress"><div id="progressBar"></div></div>
      <div class="stats" id="stats">Paket: 0 / ?</div>
      <button class="btn ghost" id="stopBtn">Durdur</button>
    </div>
    <div id="recvDone" class="hidden">
      <div class="card">
        <img id="result" class="result-img" alt="">
      </div>
      <div class="info" id="doneInfo"></div>
      <button class="btn big" id="saveBtn">💾 Fotoğrafı Kaydet</button>
      <button class="btn ghost" id="newBtn">Yeni Al</button>
    </div>
  </section>
</main>

<div id="overlay" class="overlay"></div>
<input type="file" id="file" accept="image/*" hidden>

<script>
/* =====================================================================
   PROTOKOL (değişmedi, sadece kenar düzeltmeleri)
   12 ton, eşit parlaklık. 0-9 rakam, 10=R(tekrar), 11=S(başla), gri=boş.
   Çerçeve: S + idx(4) + veri(24) + sağlama(2) = 30 sembol
   Tur: gri(5) + kalibrasyon(12×3) + tüm paketler
   ===================================================================== */
const P = 24, PKT_N = 4 + P + 2, HOLD = 3, SYM_R = 10, SYM_S = 11;
const GRAY = [153, 153, 153];

const hexHue = (r,g,b) => { const h = Math.atan2(Math.sqrt(3)*(g-b), 2*r-g-b)*180/Math.PI; return (h+360)%360; };
const hueDiff = (a,b) => { const d = Math.abs(a-b)%360; return d>180 ? 360-d : d; };
const hueSigned = (a,b) => ((b-a+540)%360)-180;
const satOf = (r,g,b) => { const s = r+g+b; return s>0 ? (Math.max(r,g,b)-Math.min(r,g,b))/s : 0; };

function palColor(deg){
  const t = deg*Math.PI/180, a = Math.cos(t), b = Math.sin(t);
  const dr = a/3, dg = (-dr + b/Math.sqrt(3))/2, db = (-dr - b/Math.sqrt(3))/2;
  const L = 0.299*dr + 0.587*dg + 0.114*db;
  const d = [dr-L, dg-L, db-L];
  const span = Math.max(...d) - Math.min(...d);
  return d.map(v => Math.max(0, Math.min(255, Math.round(255*(0.6 + 0.4*v/span)))));
}
const SYMCOL = Array.from({length:12}, (_,k) => palColor(15 + 30*k));
const symRGB = s => s < 0 ? GRAY : SYMCOL[s];

/* ---------- görsel -> palet -> quadtree ---------- */
function buildPalette(data, N, K){
  const step = Math.max(1, Math.floor(N/6000)), S = [];
  for (let i = 0; i < N; i += step) S.push([data[4*i], data[4*i+1], data[4*i+2]]);
  const d2 = (p,c) => (p[0]-c[0])**2 + (p[1]-c[1])**2 + (p[2]-c[2])**2;
  let C = [S[0].slice()];
  while (C.length < K){
    let best = S[0], bd = -1;
    for (const p of S){
      let m = 1e18;
      for (const c of C){ const d = d2(p,c); if (d < m) m = d; }
      if (m > bd){ bd = m; best = p; }
    }
    C.push(best.slice());
  }
  for (let it = 0; it < 10; it++){
    const sum = C.map(() => [0,0,0,0]);
    for (const p of S){
      let bi = 0, bd = 1e18;
      for (let i = 0; i < C.length; i++){ const d = d2(p,C[i]); if (d < bd){ bd = d; bi = i; } }
      const s = sum[bi]; s[0]+=p[0]; s[1]+=p[1]; s[2]+=p[2]; s[3]++;
    }
    C = C.map((c,i) => sum[i][3] ? [sum[i][0]/sum[i][3], sum[i][1]/sum[i][3], sum[i][2]/sum[i][3]] : c);
  }
  return C.map(c => c.map(v => Math.max(0, Math.min(255, Math.round(v)))));
}

function labelImage(data, N, pal){
  const L = new Uint8Array(N), K = pal.length;
  for (let i = 0; i < N; i++){
    const r = data[4*i], g = data[4*i+1], b = data[4*i+2];
    let bi = 0, bd = 1e9;
    for (let k = 0; k < K; k++){
      const p = pal[k], d = (r-p[0])**2 + (g-p[1])**2 + (b-p[2])**2;
      if (d < bd){ bd = d; bi = k; }
    }
    L[i] = bi;
  }
  return L;
}

function kids(x,y,w,h){
  const wl = Math.ceil(w/2), hl = Math.ceil(h/2), o = [[x,y,wl,hl]];
  if (w-wl > 0) o.push([x+wl, y, w-wl, hl]);
  if (h-hl > 0) o.push([x, y+hl, wl, h-hl]);
  if (w-wl > 0 && h-hl > 0) o.push([x+wl, y+hl, w-wl, h-hl]);
  return o;
}

function quadEncode(L, W, H, K, tol, minB){
  const tokens = [], leaves = [], q = [[0,0,W,H]], cnt = new Int32Array(K);
  let qi = 0;
  while (qi < q.length){
    const [x,y,w,h] = q[qi++];
    cnt.fill(0);
    for (let yy = y; yy < y+h; yy++){ const o = yy*W; for (let xx = x; xx < x+w; xx++) cnt[L[o+xx]]++; }
    let bi = 0; for (let i = 1; i < K; i++) if (cnt[i] > cnt[bi]) bi = i;
    const area = w*h;
    if (area === 1 || cnt[bi] >= area*(1-tol) || (w <= minB && h <= minB)){
      tokens.push(bi); leaves.push([x,y,w,h,bi]);
    } else {
      tokens.push(9);
      for (const c of kids(x,y,w,h)) q.push(c);
    }
  }
  return { tokens, leaves };
}

const digitsOf = (n,len) => { const a = []; for (let i = len-1; i >= 0; i--) a.push(Math.floor(n/Math.pow(10,i))%10); return a; };

function buildLogical(W, H, pal, tokens){
  const K = pal.length, L = 13 + 9*K + tokens.length, total = Math.ceil(L/P);
  const d = [...digitsOf(total,4), ...digitsOf(W,4), ...digitsOf(H,4), K];
  for (const c of pal) for (const v of c) d.push(...digitsOf(v,3));
  for (const t of tokens) d.push(t);
  while (d.length % P) d.push(0);
  return { digits: d, total };
}

function checks(a){
  let s1 = 0, s2 = 0;
  for (let i = 0; i < a.length; i++){ s1 += a[i]; s2 += (i+1)*a[i]; }
  return [s1%10, s2%10];
}

function buildFrames(digits, total){
  const fr = []; let last = null;
  const raw = s => { fr.push(s); last = s; };
  for (let i = 0; i < 5; i++) raw(-1);
  for (let k = 0; k < 12; k++) for (let j = 0; j < HOLD; j++) raw(k);
  for (let p = 0; p < total; p++){
    const pk = [...digitsOf(p,4), ...digits.slice(p*P, p*P+P)];
    pk.push(...checks(pk));
    if (last !== SYM_S) raw(SYM_S);
    for (const d of pk) raw(last === d ? SYM_R : d);
  }
  return fr;
}

function patternOk(win){
  if (win.length < 12) return false;
  for (const r of win) if (r.neutral) return false;
  let sum = 0;
  for (let k = 1; k < 12; k++){
    const d = (win[k].hue - win[k-1].hue + 360) % 360;
    if (d < 4 || d > 100) return false;
    sum += d;
  }
  return sum > 270 && sum < 368;
}

class Rx {
  constructor(cb, conf = 3){ this.cb = cb; this.conf = conf; this.reset(); }
  reset(){
    this.satThr = 0.10; this.cur = null; this.alt = null; this.win = [];
    this.refs = null; this.mode = 'wait';
    this.lastSym = -2; this.pkt = null; this.pk = {};
    this.ok = 0; this.bad = 0; this.dup = 0; this.total = 0; this.next = 0;
    this.dec = { buf: [], pos: 0, stage: 0, total: 0, W: 0, H: 0, K: 0, pal: [], q: [], qi: 0 };
    this.done = false; this.cal = 0; this.live = null;
  }
  nearest(hue){
    let best = 0, bd = 999;
    for (let k = 0; k < 12; k++){ const d = hueDiff(hue, this.refs[k]); if (d < bd){ bd = d; best = k; } }
    return { sym: best, diff: bd };
  }
  feed(rgb){
    if (this.done) return;
    const [r,g,b] = rgb;
    const neutral = (r+g+b) < 45 || satOf(r,g,b) < this.satThr;
    const hue = hexHue(r,g,b);
    this.live = { hue, neutral, sym: (!neutral && this.refs) ? this.nearest(hue).sym : null };
    const near = x => x && x.neutral === neutral && (neutral || hueDiff(x.hue, hue) < 13);
    const add = x => { x.n++; x.sum[0]+=r; x.sum[1]+=g; x.sum[2]+=b; x.hue = hexHue(x.sum[0],x.sum[1],x.sum[2]); };
    let c = this.cur;
    if (near(c)){ add(c); this.alt = null; }
    else if (near(this.alt)){
      add(this.alt);
      if (this.alt.n >= 2){ c = this.cur = this.alt; this.alt = null; }
    } else this.alt = { sum: [r,g,b], n: 1, ok: false, neutral, hue };
    if (!c){ c = this.cur = this.alt; this.alt = null; }
    if (c && !c.ok && c.n >= this.conf){ c.ok = true; this.onRun(c); }
  }
  onRun(run){
    const w = { hue: run.hue, neutral: run.neutral, sat: satOf(run.sum[0], run.sum[1], run.sum[2]) };
    const lw = this.win[this.win.length-1];
    if (lw && !lw.neutral && !w.neutral && hueDiff(lw.hue, w.hue) < 10){ lw.hue = w.hue; lw.sat = w.sat; }
    else { this.win.push(w); if (this.win.length > 12) this.win.shift(); }
    if (patternOk(this.win)){
      this.refs = this.win.map(r => r.hue);
      this.satThr = Math.max(0.05, 0.5*Math.min(...this.win.map(r => r.sat)));
      this.win = [];
      this.mode = 'data'; this.lastSym = SYM_S; this.pkt = { d: [], last: null };
      this.cal++; this.cb.onCal && this.cb.onCal(this.cal);
      return;
    }
    if (this.mode !== 'data') return;
    if (run.neutral){ this.pkt = null; this.lastSym = -1; return; }
    const n = this.nearest(run.hue);
    if (n.sym === this.lastSym) return;
    this.lastSym = n.sym;
    if (n.diff < 10) this.refs[n.sym] = (this.refs[n.sym] + 0.15*hueSigned(this.refs[n.sym], run.hue) + 360) % 360;
    this.sym(n.sym);
  }
  sym(s){
    if (s === SYM_S){ this.pkt = { d: [], last: null }; return; }
    const p = this.pkt; if (!p) return;
    let d;
    if (s === SYM_R){ if (p.last === null){ this.pkt = null; return; } d = p.last; } else d = s;
    p.last = d; p.d.push(d);
    if (p.d.length === PKT_N) this.endPkt();
  }
  endPkt(){
    const a = this.pkt.d; this.pkt = null;
    const body = a.slice(0, 4+P), c = checks(body);
    if (c[0] !== a[4+P] || c[1] !== a[5+P]){ this.bad++; this.cb.onPacket && this.cb.onPacket(); return; }
    const idx = a[0]*1000 + a[1]*100 + a[2]*10 + a[3];
    if (this.total && idx >= this.total) this.bad++;
    else if (this.pk[idx]) this.dup++;
    else { this.pk[idx] = a.slice(4, 4+P); this.ok++; this.absorb(); }
    this.cb.onPacket && this.cb.onPacket();
  }
  absorb(){
    let moved = false;
    while (this.pk[this.next]){ for (const v of this.pk[this.next]) this.dec.buf.push(v); this.next++; moved = true; }
    if (moved) this.decode();
  }
  decode(){
    const d = this.dec, cb = this.cb;
    const num = len => { let v = 0; for (let i = 0; i < len; i++) v = v*10 + d.buf[d.pos++]; return v; };
    for (;;){
      if (d.stage === 0){
        if (d.buf.length - d.pos < 13) return;
        d.total = num(4); d.W = num(4); d.H = num(4); d.K = num(1);
        if (d.W < 1 || d.H < 1 || d.K < 1 || d.K > 16 || d.total < 1){ d.stage = -1; return; }
        this.total = d.total; d.stage = 1;
      } else if (d.stage === 1){
        if (d.buf.length - d.pos < 9*d.K) return;
        for (let k = 0; k < d.K; k++) d.pal.push([Math.min(255,num(3)), Math.min(255,num(3)), Math.min(255,num(3))]);
        d.q = [[0,0,d.W,d.H]]; d.qi = 0; d.stage = 2;
        cb.onInit && cb.onInit(d.W, d.H, d.pal);
      } else if (d.stage === 2){
        while (d.pos < d.buf.length && d.qi < d.q.length){
          const t = d.buf[d.pos++], [x,y,w,h] = d.q[d.qi++];
          if (t === 9 && w*h > 1){ for (const c of kids(x,y,w,h)) d.q.push(c); }
          else if (t < d.K) cb.onPaint && cb.onPaint(x, y, w, h, d.pal[t]);
        }
        if (d.qi >= d.q.length){ d.stage = 3; this.done = true; cb.onDone && cb.onDone(); }
        return;
      } else return;
    }
  }
}

/* =====================================================================
   SADELEŞTİRİLMİŞ AYARLAR — kullanıcı hiçbir şey ayarlamıyor
   ===================================================================== */
const CFG = { W: 160, K: 6, TOL: 0.12, MINB: 3, T: 150, LOOPS: 2, DELAY: 4 };

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = s => { const m = Math.floor(s/60), sec = Math.round(s%60); return m > 0 ? `${m} dk ${sec} sn` : `${sec} sn`; };

/* =====================================================================
   GÖNDERİCİ
   ===================================================================== */
let srcImg = null, plan = null, prepBusy = false;
let sending = false, sendCancel = false, wakeLk = null;

$('pickBtn').onclick = () => $('file').click();
$('changeBtn').onclick = () => { srcImg = null; plan = null; $('sendEmpty').classList.remove('hidden'); $('sendReady').classList.add('hidden'); };

$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const url = URL.createObjectURL(f);
  const im = new Image();
  im.onload = () => { srcImg = im; $('preview').src = url; prepare(); };
  im.onerror = () => { URL.revokeObjectURL(url); $('sendInfo').textContent = 'Fotoğraf açılamadı.'; };
  im.src = url;
};

async function prepare(){
  if (!srcImg || prepBusy) return;
  prepBusy = true;
  $('sendEmpty').classList.add('hidden');
  $('sendReady').classList.remove('hidden');
  $('sendInfo').textContent = 'Hazırlanıyor…';
  $('startBtn').disabled = true;

  await sleep(30);
  const W = Math.min(CFG.W, srcImg.naturalWidth);
  const H = Math.max(1, Math.round(W * srcImg.naturalHeight / srcImg.naturalWidth));

  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.imageSmoothingQuality = 'high';
  x.drawImage(srcImg, 0, 0, W, H);
  const data = x.getImageData(0, 0, W, H).data, N = W*H;

  const pal = buildPalette(data, N, CFG.K);
  const lab = labelImage(data, N, pal);
  const { tokens } = quadEncode(lab, W, H, CFG.K, CFG.TOL, CFG.MINB);
  const lg = buildLogical(W, H, pal, tokens);
  const frames = buildFrames(lg.digits, lg.total);

  plan = { W, H, pal, tokens, frames, total: lg.total };

  const one = frames.length * CFG.T / 1000;
  $('sendInfo').textContent = `${W}×${H} · ~${fmt(one)}`;
  $('startBtn').disabled = false;
  prepBusy = false;
}

const overlay = $('overlay');

async function startSend(){
  if (!plan || sending) return;
  sending = true; sendCancel = false;

  overlay.classList.add('show');
  overlay.style.backgroundColor = `rgb(${GRAY})`;
  overlay.textContent = '';
  try { await overlay.requestFullscreen?.(); } catch(e) {}
  try { wakeLk = await navigator.wakeLock?.request('screen'); } catch(e) {}

  // geri sayım (iptal edilebilir)
  for (let i = CFG.DELAY; i > 0; i--){
    if (sendCancel) return stopSend();
    overlay.textContent = i;
    await sleep(1000);
  }
  if (sendCancel) return stopSend();
  overlay.textContent = '';

  const frames = plan.frames;
  let i = -1, done = 0, next = performance.now();

  const tick = now => {
    if (!sending) return;
    if (now >= next){
      i++;
      if (i >= frames.length){
        done++;
        if (done >= CFG.LOOPS){ stopSend(); return; }
        i = 0;
      }
      overlay.style.backgroundColor = `rgb(${symRGB(frames[i])})`;
      next = (now - next > CFG.T ? now : next) + CFG.T;
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function stopSend(){
  sending = false; sendCancel = false;
  overlay.classList.remove('show');
  overlay.style.backgroundColor = '';
  overlay.textContent = '';
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  if (wakeLk){ try { wakeLk.release(); } catch(e){} wakeLk = null; }
}

overlay.onclick = () => { sendCancel = true; };
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && sending) stopSend();
});
$('startBtn').onclick = startSend;

/* =====================================================================
   ALICI
   ===================================================================== */
const video = $('video');
const out = document.createElement('canvas');
const octx = out.getContext('2d');
const sc = document.createElement('canvas'); sc.width = sc.height = 32;
const sx = sc.getContext('2d', { willReadFrequently: true });

let stream = null, listening = false, rx = null, rWake = null, locked = false;
let lastBlobUrl = null;
let fpsCount = 0, fpsLast = 0;

const setStatus = (t, kind) => {
  $('statusText').textContent = t;
  const dot = $('statusDot');
  dot.className = 'status-dot' + (kind === 'live' ? ' live' : kind === 'warn' ? ' warn' : '');
};

function updateStats(){
  if (!rx) return;
  const total = rx.total || 0;
  $('progressBar').style.width = total ? Math.min(100, 100*rx.ok/total) + '%' : '0%';
  $('stats').textContent = total
    ? `${rx.ok} / ${total} paket · hata ${rx.bad}`
    : 'Sinyal bekleniyor…';
}

function newRx(){
  rx = new Rx({
    onCal: n => {
      if (n === 1){ setStatus('Kalibrasyon alındı, veri okunuyor…', 'live'); lockCamera(); }
      updateStats();
    },
    onInit: (W, H) => {
      out.width = W; out.height = H;
      octx.fillStyle = '#222'; octx.fillRect(0, 0, W, H);
      setStatus('Görsel alınıyor…', 'live');
    },
    onPaint: (x, y, w, h, c) => {
      octx.fillStyle = `rgb(${c})`;
      octx.fillRect(x, y, w, h);
    },
    onPacket: updateStats,
    onDone: () => {
      setStatus('Tamamlandı ✔', 'live');
      finishRecv();
    }
  }, 3);
  $('progressBar').style.width = '0%';
  updateStats();
}

async function lockCamera(){
  try {
    const tr = stream && stream.getVideoTracks()[0]; if (!tr || locked) return;
    const caps = tr.getCapabilities ? tr.getCapabilities() : {};
    const s = tr.getSettings ? tr.getSettings() : {};
    const adv = {};
    if (caps.exposureMode && caps.exposureMode.includes('manual')){
      adv.exposureMode = 'manual'; if (s.exposureTime) adv.exposureTime = s.exposureTime;
    }
    if (caps.whiteBalanceMode && caps.whiteBalanceMode.includes('manual')){
      adv.whiteBalanceMode = 'manual'; if (s.colorTemperature) adv.colorTemperature = s.colorTemperature;
    }
    if (Object.keys(adv).length){ await tr.applyConstraints({ advanced: [adv] }); locked = true; }
  } catch(e){}
}

function sample(){
  sx.drawImage(video, 0, 0, 32, 32);
  const d = sx.getImageData(8, 8, 16, 16).data;
  let r = 0, g = 0, b = 0;
  const n = d.length/4;
  for (let i = 0; i < d.length; i += 4){ r += d[i]; g += d[i+1]; b += d[i+2]; }
  return [r/n, g/n, b/n];
}

function rLoop(){
  if (!listening) return;
  try {
    const s = sample();
    rx.feed(s);
  } catch(e){}
  // FPS ölçümü + conf otomatik ayarı
  const t = performance.now();
  fpsCount++;
  if (t - fpsLast > 1200){
    const fps = fpsCount * 1000 / (t - fpsLast);
    fpsCount = 0; fpsLast = t;
    if (rx){
      const perSym = (CFG.T / 1000) * fps;
      rx.conf = Math.max(2, Math.min(6, Math.round(perSym / 2.5)));
    }
  }
  if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(rLoop);
  else setTimeout(rLoop, 1000/30);
}

async function startListen(){
  stopListen();
  locked = false;
  $('recvEmpty').classList.add('hidden');
  $('recvDone').classList.add('hidden');
  $('recvActive').classList.remove('hidden');
  setStatus('Kamera açılıyor…', 'warn');

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setStatus('Bu tarayıcı kamerayı desteklemiyor. Chrome kullanın.', 'warn');
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 640 },
        height: { ideal: 480 },
        frameRate: { ideal: 60 }
      },
      audio: false
    });
  } catch(e){
    setStatus('Kamera izni gerekli. Sayfayı https üzerinden açın.', 'warn');
    $('recvActive').classList.add('hidden');
    $('recvEmpty').classList.remove('hidden');
    return;
  }
  video.srcObject = stream;
  try { await video.play(); } catch(e){}
  try { rWake = await navigator.wakeLock?.request('screen'); } catch(e){}

  newRx();
  listening = true;
  fpsCount = 0; fpsLast = performance.now();
  setStatus('Dinleniyor… Gönderen ekranı hedefe tutun.', 'live');
  rLoop();
}

function stopListen(){
  listening = false;
  if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  if (rWake){ try { rWake.release(); } catch(e){} rWake = null; }
}

function finishRecv(){
  stopListen();
  out.toBlob(b => {
    if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
    lastBlobUrl = URL.createObjectURL(b);
    $('result').src = lastBlobUrl;
    $('recvActive').classList.add('hidden');
    $('recvDone').classList.remove('hidden');
    $('doneInfo').textContent = 'Fotoğraf alındı.';
  }, 'image/png');
}

$('listenBtn').onclick = startListen;
$('stopBtn').onclick = () => {
  stopListen();
  $('recvActive').classList.add('hidden');
  $('recvEmpty').classList.remove('hidden');
};
$('newBtn').onclick = () => {
  if (lastBlobUrl){ URL.revokeObjectURL(lastBlobUrl); lastBlobUrl = null; }
  $('result').src = '';
  $('recvDone').classList.add('hidden');
  $('recvEmpty').classList.remove('hidden');
};
$('saveBtn').onclick = () => {
  if (!lastBlobUrl) return;
  const a = document.createElement('a');
  a.href = lastBlobUrl;
  a.download = 'renk-kanali.png';
  a.click();
};

/* =====================================================================
   SEKMELER
   ===================================================================== */
$('tabS').onclick = () => {
  if (listening) stopListen();
  if (sending) stopSend();
  $('send').classList.remove('hidden');
  $('recv').classList.add('hidden');
  $('tabS').classList.add('on');
  $('tabR').classList.remove('on');
};
$('tabR').onclick = () => {
  if (sending) stopSend();
  $('recv').classList.remove('hidden');
  $('send').classList.add('hidden');
  $('tabR').classList.add('on');
  $('tabS').classList.remove('on');
};

/* Sekme gizlenince kamera ve gönderimi durdur */
document.addEventListener('visibilitychange', () => {
  if (document.hidden){
    if (sending) stopSend();
  }
});
</script>
